[package]
name = "digital-membership"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.23"
blst = "0.3.17"
clap = { version = "4.5", features = ["derive"] }
form_urlencoded = "1.2"
getrandom = "0.4"
namecompress = "0.2.0"
openssl = { version = "0.10", features = ["vendored"] }
png = "0.18"
qrcode-generator = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread"] }
toml = "1.0"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xz2 = "0.1"
zip = { version = "8.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
